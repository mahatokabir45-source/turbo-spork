```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infinite Love ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#020008;
    font-family:Arial,Helvetica,sans-serif;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
}

.text{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    pointer-events:none;
    z-index:5;
    width:90%;
}

.title{
    font-size:clamp(30px,6vw,75px);
    font-weight:bold;
    color:white;
    letter-spacing:4px;
    text-shadow:
        0 0 10px #ff2d75,
        0 0 30px #ff2d75,
        0 0 70px #ff004c;
    animation:titlePulse 2s infinite;
}

.subtitle{
    margin-top:18px;
    font-size:clamp(14px,2vw,22px);
    color:#ffd6e4;
    letter-spacing:3px;
    opacity:.85;
}

@keyframes titlePulse{
    0%,100%{
        transform:scale(1);
        opacity:.9;
    }
    50%{
        transform:scale(1.05);
        opacity:1;
    }
}

.hint{
    position:fixed;
    bottom:30px;
    left:50%;
    transform:translateX(-50%);
    color:#ffffff88;
    font-size:13px;
    letter-spacing:2px;
    z-index:6;
    pointer-events:none;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div class="text">
    <div class="title">I LOVE YOU ❤️</div>
    <div class="subtitle">A universe made just for you ✨</div>
</div>

<div class="hint">CLICK ANYWHERE ✨</div>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W,H;
let particles=[];
let stars=[];
let explosions=[];
let orbiters=[];

function resize(){

    W = canvas.width = window.innerWidth * devicePixelRatio;
    H = canvas.height = window.innerHeight * devicePixelRatio;

    canvas.style.width = innerWidth+"px";
    canvas.style.height = innerHeight+"px";

    ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);

    W = innerWidth;
    H = innerHeight;
}

resize();
window.addEventListener("resize",resize);


/* =========================
   HEART MATHEMATICS
========================= */

function heartPoint(t,scale){

    const x =
        16 * Math.pow(Math.sin(t),3);

    const y =
        -(13*Math.cos(t)
        -5*Math.cos(2*t)
        -2*Math.cos(3*t)
        -Math.cos(4*t));

    return {
        x:x*scale,
        y:y*scale
    };
}


/* =========================
   HEART PARTICLES
========================= */

function createHeartParticles(){

    particles=[];

    const amount = Math.min(
        5000,
        Math.floor(innerWidth * innerHeight / 180)
    );

    for(let i=0;i<amount;i++){

        const t=Math.random()*Math.PI*2;

        const p=heartPoint(
            t,
            Math.min(W,H)/42
        );

        const fill=Math.pow(Math.random(),0.5);

        particles.push({

            x:W/2 + p.x*fill,
            y:H/2 + p.y*fill,

            ox:p.x*fill,
            oy:p.y*fill,

            size:Math.random()*1.8+.3,

            alpha:Math.random()*.8+.2,

            phase:Math.random()*Math.PI*2,

            speed:.5+Math.random()*2,

            glow:Math.random()*20+5
        });
    }
}

createHeartParticles();


/* =========================
   BACKGROUND STARS
========================= */

for(let i=0;i<350;i++){

    stars.push({

        x:Math.random()*innerWidth,
        y:Math.random()*innerHeight,

        size:Math.random()*1.7+.2,

        alpha:Math.random(),

        speed:Math.random()*.02+.005
    });
}


/* =========================
   ORBITING HEARTS
========================= */

for(let i=0;i<12;i++){

    orbiters.push({

        angle:Math.random()*Math.PI*2,

        radius:100+Math.random()*170,

        speed:(Math.random()*.003+.0015)
            *(Math.random()<.5?-1:1),

        size:8+Math.random()*10
    });
}


/* =========================
   DRAW BACKGROUND
========================= */

function background(){

    const gradient=ctx.createRadialGradient(
        W/2,H/2,0,
        W/2,H/2,
        Math.max(W,H)*.7
    );

    gradient.addColorStop(0,"#250014");
    gradient.addColorStop(.35,"#0d0012");
    gradient.addColorStop(1,"#020008");

    ctx.fillStyle=gradient;
    ctx.fillRect(0,0,W,H);

    /* nebula glow */

    const glow=ctx.createRadialGradient(
        W/2,H/2,0,
        W/2,H/2,350
    );

    glow.addColorStop(0,"rgba(255,0,90,.15)");
    glow.addColorStop(.5,"rgba(180,0,100,.06)");
    glow.addColorStop(1,"transparent");

    ctx.fillStyle=glow;
    ctx.fillRect(0,0,W,H);
}


/* =========================
   STARS
========================= */

function drawStars(){

    for(const s of stars){

        s.alpha += s.speed;

        const opacity =
            .3 + Math.sin(s.alpha)*.5;

        ctx.beginPath();

        ctx.fillStyle =
            `rgba(255,190,220,${opacity})`;

        ctx.arc(
            s.x,
            s.y,
            s.size,
            0,
            Math.PI*2
        );

        ctx.fill();
    }
}


/* =========================
   PARTICLE HEART
========================= */

function drawHeart(time){

    const pulse =
        1 +
        Math.sin(time*.0025)*.035;

    for(const p of particles){

        const movement =
            Math.sin(
                time*.001*p.speed+
                p.phase
            )*1.5;

        const x =
            W/2 +
            p.ox*pulse +
            movement;

        const y =
            H/2 +
            p.oy*pulse +
            movement;

        const alpha =
            p.alpha *
            (.65 + Math.sin(
                time*.003+p.phase
            )*.35);

        ctx.beginPath();

        ctx.shadowBlur=p.glow;

        ctx.shadowColor=
            "rgba(255,30,110,.8)";

        ctx.fillStyle=
            `rgba(255,45,110,${alpha})`;

        ctx.arc(
            x,
            y,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    ctx.shadowBlur=0;
}


/* =========================
   ORBITING HEARTS
========================= */

function drawSmallHeart(x,y,size){

    ctx.save();

    ctx.translate(x,y);

    ctx.scale(size/20,size/20);

    ctx.beginPath();

    ctx.moveTo(0,7);

    ctx.bezierCurveTo(
        -15,-3,
        -10,-15,
        0,-8
    );

    ctx.bezierCurveTo(
        10,-15,
        15,-3,
        0,7
    );

    ctx.fillStyle="#ff4f91";

    ctx.shadowBlur=20;

    ctx.shadowColor="#ff1765";

    ctx.fill();

    ctx.restore();
}

function drawOrbiters(){

    const cx=W/2;
    const cy=H/2;

    orbiters.forEach(o=>{

        o.angle+=o.speed;

        const x =
            cx+
            Math.cos(o.angle)*o.radius;

        const y =
            cy+
            Math.sin(o.angle)*o.radius*.55;

        drawSmallHeart(
            x,
            y,
            o.size
        );
    });
}


/* =========================
   SHOOTING STARS
========================= */

let shootingStars=[];

function spawnShootingStar(){

    shootingStars.push({

        x:Math.random()*W,

        y:Math.random()*H*.5,

        length:80+Math.random()*130,

        speed:8+Math.random()*10,

        alpha:1
    });
}

setInterval(spawnShootingStar,1800);

function drawShootingStars(){

    for(let i=shootingStars.length-1;i>=0;i--){

        const s=shootingStars[i];

        ctx.beginPath();

        const gradient=ctx.createLinearGradient(
            s.x,
            s.y,
            s.x-s.length,
            s.y+s.length
        );

        gradient.addColorStop(
            0,
            `rgba(255,255,255,${s.alpha})`
        );

        gradient.addColorStop(
            1,
            "transparent"
        );

        ctx.strokeStyle=gradient;

        ctx.lineWidth=2;

        ctx.moveTo(
            s.x,
            s.y
        );

        ctx.lineTo(
            s.x-s.length,
            s.y+s.length
        );

        ctx.stroke();

        s.x+=s.speed;
        s.y+=s.speed;
        s.alpha-=.015;

        if(
            s.alpha<=0 ||
            s.x>W ||
            s.y>H
        ){
            shootingStars.splice(i,1);
        }
    }
}


/* =========================
   CLICK EXPLOSION
========================= */

function createExplosion(x,y){

    for(let i=0;i<100;i++){

        const angle=
            Math.random()*Math.PI*2;

        const speed=
            2+Math.random()*8;

        explosions.push({

            x:x,
            y:y,

            vx:Math.cos(angle)*speed,
            vy:Math.sin(angle)*speed,

            life:1,

            size:2+Math.random()*4
        });
    }
}

function drawExplosions(){

    for(let i=explosions.length-1;i>=0;i--){

        const p=explosions[i];

        p.x+=p.vx;
        p.y+=p.vy;

        p.vx*=.97;
        p.vy*=.97;

        p.life-=.015;

        ctx.beginPath();

        ctx.fillStyle=
            `rgba(255,70,130,${p.life})`;

        ctx.shadowBlur=15;

        ctx.shadowColor="#ff1f70";

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fill();

        if(p.life<=0){

            explosions.splice(i,1);
        }
    }

    ctx.shadowBlur=0;
}


/* =========================
   MOUSE LIGHT
========================= */

let mouse={
    x:-1000,
    y:-1000
};

window.addEventListener("mousemove",e=>{

    mouse.x=e.clientX;
    mouse.y=e.clientY;
});


/* =========================
   MAIN ANIMATION
========================= */

function animate(time){

    ctx.clearRect(0,0,W,H);

    background();

    drawStars();

    drawShootingStars();

    drawHeart(time);

    drawOrbiters();

    drawExplosions();

    /* mouse glow */

    if(mouse.x>0){

        const glow=
            ctx.createRadialGradient(
                mouse.x,
                mouse.y,
                0,
                mouse.x,
                mouse.y,
                180
            );

        glow.addColorStop(
            0,
            "rgba(255,60,130,.12)"
        );

        glow.addColorStop(
            1,
            "transparent"
        );

        ctx.fillStyle=glow;

        ctx.beginPath();

        ctx.arc(
            mouse.x,
            mouse.y,
            180,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    requestAnimationFrame(animate);
}

animate(0);


/* =========================
   CLICK
========================= */

window.addEventListener("click",e=>{

    createExplosion(
        e.clientX,
        e.clientY
    );

});

</script>

</body>
</html>
