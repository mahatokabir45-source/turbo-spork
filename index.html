<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Heart ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle at center, #3a0718, #120009 70%);
    font-family: Arial, sans-serif;
    color: white;
}

/* Background glow */
body::before {
    content: "";
    position: absolute;
    width: 450px;
    height: 450px;
    background: #ff1744;
    filter: blur(150px);
    opacity: 0.18;
    animation: glow 3s infinite alternate;
}

@keyframes glow {
    from { transform: scale(0.8); opacity: 0.12; }
    to { transform: scale(1.2); opacity: 0.25; }
}

.container {
    position: relative;
    text-align: center;
    z-index: 2;
}

.heart {
    position: relative;
    width: 130px;
    height: 130px;
    background: #ff1744;
    transform: rotate(-45deg);
    margin: 0 auto 70px;
    box-shadow:
        0 0 25px #ff1744,
        0 0 60px #ff1744,
        0 0 100px rgba(255, 23, 68, 0.5);

    animation: heartbeat 1.2s infinite;
}

.heart::before,
.heart::after {
    content: "";
    position: absolute;
    width: 130px;
    height: 130px;
    background: #ff1744;
    border-radius: 50%;
}

.heart::before {
    top: -65px;
    left: 0;
}

.heart::after {
    left: 65px;
    top: 0;
}

@keyframes heartbeat {
    0%, 100% {
        transform: rotate(-45deg) scale(1);
    }

    25% {
        transform: rotate(-45deg) scale(1.12);
    }

    40% {
        transform: rotate(-45deg) scale(1);
    }

    60% {
        transform: rotate(-45deg) scale(1.15);
    }
}

.message {
    font-size: 28px;
    font-weight: bold;
    text-shadow: 0 0 15px #ff4770;
    animation: fade 2s infinite alternate;
}

.sub {
    margin-top: 12px;
    font-size: 16px;
    opacity: 0.8;
}

@keyframes fade {
    from { opacity: 0.65; }
    to { opacity: 1; }
}

/* Floating hearts */
.floating-heart {
    position: absolute;
    bottom: -30px;
    font-size: 20px;
    animation: floatUp linear forwards;
    pointer-events: none;
}

@keyframes floatUp {
    0% {
        transform: translateY(0) scale(0.5) rotate(0deg);
        opacity: 0;
    }

    15% {
        opacity: 1;
    }

    100% {
        transform:
            translateY(-110vh)
            translateX(var(--move))
            scale(1.5)
            rotate(360deg);
        opacity: 0;
    }
}

/* Click hearts */
.click-heart {
    position: fixed;
    pointer-events: none;
    font-size: 25px;
    animation: clickAnim 1s ease-out forwards;
}

@keyframes clickAnim {
    0% {
        transform: translate(-50%, -50%) scale(0);
        opacity: 1;
    }

    100% {
        transform:
            translate(
                calc(-50% + var(--x)),
                calc(-50% + var(--y))
            )
            scale(1.5);
        opacity: 0;
    }
}
</style>
</head>

<body>

<div class="container">
    <div class="heart"></div>

    <div class="message">
        You Have My Heart ❤️
    </div>

    <div class="sub">
        Forever & Always ✨
    </div>
</div>

<script>

/* Create floating hearts */
function createHeart() {

    const heart = document.createElement("div");

    heart.className = "floating-heart";

    const hearts = ["❤️", "💖", "💕", "💗", "💓", "💘"];

    heart.innerHTML =
        hearts[Math.floor(Math.random() * hearts.length)];

    heart.style.left =
        Math.random() * 100 + "vw";

    heart.style.setProperty(
        "--move",
        (Math.random() * 200 - 100) + "px"
    );

    heart.style.animationDuration =
        (4 + Math.random() * 5) + "s";

    heart.style.fontSize =
        (15 + Math.random() * 25) + "px";

    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 9000);
}

setInterval(createHeart, 350);


/* Hearts wherever you click */
document.addEventListener("click", function(e) {

    for (let i = 0; i < 6; i++) {

        const heart = document.createElement("div");

        heart.className = "click-heart";
        heart.innerHTML = "💗";

        heart.style.left = e.clientX + "px";
        heart.style.top = e.clientY + "px";

        heart.style.setProperty(
            "--x",
            (Math.random() * 160 - 80) + "px"
        );

        heart.style.setProperty(
            "--y",
            (Math.random() * 160 - 80) + "px"
        );

        document.body.appendChild(heart);

        setTimeout(() => {
            heart.remove();
        }, 1000);
    }
});

</script>

</body>
</html>
